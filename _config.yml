title: "LLM Grader"
description: "Lightweight LLM tool for autograding"
remote_theme: just-the-docs/just-the-docs
baseurl: "/llmgrader" # Only needed if using a project page
url: "https://sdrangan.github.io"

# Navigation settings
nav_sort: case_insensitive
search_enabled: true
exclude:
  # Site-specific exclusions
  - plans
  - tests/fixtures
  - llmgrader/mcp
  - CLAUDE.md
  # Jekyll's defaults, restored -- setting `exclude` replaces them
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Markdown options
markdown: kramdown
kramdown:
  input: GFM

# Optional: GitHub repo link
github_repo_url: "https://github.com/sdrangan/llmgrader"

just_the_docs:
  favicon: "/assets/images/favicon.png"
  color_scheme: light




