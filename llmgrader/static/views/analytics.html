<div id="analytics-view" class="app-view analytics-view">

    <h2>Database Viewer</h2>

    <div class="query-section">
        <h3>SQL Query</h3>

        <div id="analytics-error" class="error" style="display:none;"></div>

        <div class="query-layout">
            <textarea id="analytics-sql-input"
                      placeholder="Enter your SQL query here..."></textarea>

            <div id="analytics-schema-panel" class="schema-panel">
                <div class="schema-panel-header">
                    <span>Columns</span>
                    <button id="analytics-schema-toggle"
                            class="schema-toggle"
                            type="button"
                            title="Show or hide the column reference">Hide</button>
                </div>
                <div id="analytics-schema-body" class="schema-panel-body">
                    <p class="info-text">Loading columns&hellip;</p>
                </div>
                <p class="schema-hint">Click a column to insert it at the cursor.</p>
            </div>
        </div>

        <button id="analytics-run-btn">Run Query</button>
        <a id="analytics-download-link"
           class="download-link"
           style="display:none;">Download CSV</a>

        <p class="info-text">
            Showing first 20 rows. Use "Download CSV" to get all results.
        </p>
    </div>

    <div class="results-section">
        <h3>Results</h3>

        <table id="analytics-results-table">
            <thead></thead>
            <tbody></tbody>
        </table>

        <p id="analytics-no-results"
           class="info-text"
           style="display:none;">
            No results to display. Run a query to see data.
        </p>
    </div>

</div>
